[project]
name = "goldenrod"
version = "0.1.0"
description = "Pre-commitment check for film and TV production. Catch it the night before, not in the cut."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]
# The Extractor's reasoning layer. Optional so the loader, the contracts and the
# whole test suite install and run without it — the model is the only part of the
# Extractor that needs a network.
gemini = [
    "google-genai>=1.0",
]
# The interface and its HTTP entry point. Optional for the same reason: the
# CLIs, the contracts and the unit suite install and run without a web server.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# The official ClickHouse MCP server. Not imported anywhere — it is launched as a
# subprocess from .mcp.json and spoken to over stdio, which is the whole point:
# it holds the only ClickHouse connection in the system. Declared here so that
# `pip install -e ".[deploy]"` produces a working container, and so the runtime
# dependency is visible to anyone reading the project rather than implied.
# Pinned rather than floated: this is the version the whole suite was verified
# against, and the demo is not the place to discover that a server release moved
# a tool name.
deploy = [
    "mcp-clickhouse==0.4.1",
]

[project.scripts]
goldenrod-load = "services.loader.__main__:main"
goldenrod-extract = "services.extractor.__main__:main"
goldenrod-check = "services.gate.__main__:main"
goldenrod-serve = "services.api.__main__:main"

[tool.setuptools.packages.find]
include = ["services*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "mcp: integration test that requires a running ClickHouse reachable through the MCP server",
]
